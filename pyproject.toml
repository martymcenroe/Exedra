[project]
name = "exedra"
version = "0.1.0"
description = "The public workshop for Palaestra scenarios: build a day at the grid interface, play it, verify it, submit it."
authors = [
    {name = "Marty McEnroe",email = "cto@thrivetech.ai"}
]
license = {text = "PolyForm-Noncommercial-1.0.0"}
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "jsonschema (>=4.26.0,<5.0.0)",
    "scipy (>=1.18.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"

[tool.poetry]
# The acceptance gate (tools/verify_pack.py) imports the palaestra package,
# which the export writes to src/palaestra/.
packages = [{include = "palaestra", from = "src"}]
